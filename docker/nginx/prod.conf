server {
    listen 80;
    server_name 158.69.219.131.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 158.69.219.131.nip.io;

    ssl_certificate /etc/letsencrypt/live/158.69.219.131.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/158.69.219.131.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 256;

    # Use Docker's internal DNS resolver to avoid startup crash
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream "http://backend:8000";

    location / {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass $backend_upstream/health;
        access_log off;
    }
}
